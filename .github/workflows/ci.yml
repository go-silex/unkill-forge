name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node scripts/check-install-config.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Lockfile cooldown
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ "$GITHUB_REF_TYPE" == 'branch' && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            base="${BEFORE:-HEAD^1}"
            if [[ "$base" =~ ^0+$ ]]; then base=HEAD^1; fi
          else
            base="origin/$DEFAULT_BRANCH"
          fi
          node scripts/check-lockfile-cooldown.mjs --base "$base" --head HEAD
      - run: npm ci
      - run: ./node_modules/.bin/biome ci .
      - name: File length ratchet
        env:
          # Feature pushes use their merge base, not the old tip before an upstream merge.
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref_type == 'branch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before) || '' }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/check-file-length.mjs --base "$BASE_SHA"
          else
            node scripts/check-file-length.mjs
          fi
      - run: node scripts/check-worker-scope.mjs
      - run: ./node_modules/.bin/knip --no-progress
      - run: ./node_modules/.bin/tsc --noEmit
      - run: node --test scripts/*.node-test.mjs
      - run: ./node_modules/.bin/vitest run --coverage && node scripts/check-coverage-floors.mjs
