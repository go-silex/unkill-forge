name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Lockfile cooldown (only if the PR changes the lockfile)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run check:lockfile-cooldown -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: npm ci
      - run: npm run lint
      - name: File length ratchet
        env:
          # Feature pushes use their merge base, not the old tip before an upstream merge.
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref_name == github.event.repository.default_branch && github.event.before) || '' }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            npm run check:file-length -- --base "$BASE_SHA"
          else
            npm run check:file-length
          fi
      - run: npm run knip
      - run: npm run typecheck
      - run: npm run test:node
      - run: npm run test:coverage
