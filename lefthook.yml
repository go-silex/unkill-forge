pre-commit:
  piped: true
  commands:
    install-config:
      priority: 1
      run: node scripts/check-install-config.mjs
    biome:
      glob: "*.{ts,tsx,mjs,json,jsonc}"
      run: ./node_modules/.bin/biome check --staged
    typecheck:
      run: ./node_modules/.bin/tsc --noEmit
commit-msg:
  commands:
    conventional:
      run: bash scripts/check-conventional-commit.sh {1}

pre-push:
  piped: true
  # Use script jobs: Lefthook skips pre-push commands when HEAD has no diff against origin/main.
  jobs:
    - name: install-config
      script: install-config.sh
      runner: bash
      args: "--"
    - name: lockfile-cooldown
      script: lockfile-cooldown.sh
      runner: bash
      args: "--"
      use_stdin: true
    - name: quality-gates
      script: quality-gates.sh
      runner: bash
      args: "--"
    - name: tests
      script: tests.sh
      runner: bash
      args: "--"
